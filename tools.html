<head>

    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* ========== Tool Page Specific ========== */
        .tools-page { padding-bottom: 80px; }

        /* Hero */
        .tools-hero { text-align: center; padding: 60px 20px 50px; position: relative; }
        .tools-hero .live-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(0,229,255,0.1); color: var(--accent-cyan); font-size: 0.75rem; font-weight: 600; padding: 4px 12px; border-radius: 20px; margin-bottom: 16px; letter-spacing: 0.05em; }
        .tools-hero .live-badge::before { content: ''; width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; animation: pulse 1.5s infinite; }
        .tools-hero h1 { font-size: 2.8rem; font-weight: 800; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin: 0 0 8px; }
        .tools-hero .subtitle { color: var(--text-secondary); font-size: 1.05rem; margin: 0 0 24px; }
        .tools-stats { display: flex; justify-content: center; gap: 40px; }
        .tools-stats .stat { text-align: center; }
        .tools-stats .stat-value { font-size: 1.6rem; font-weight: 700; color: var(--accent-cyan); }
        .tools-stats .stat-label { font-size: 0.8rem; color: var(--text-tertiary); margin-top: 2px; }

        /* Search & Filter */
        .tools-bar { max-width: 1300px; margin: 0 auto 40px; padding: 0 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .tools-search { flex: 1; min-width: 260px; position: relative; }
        .tools-search input { width: 100%; padding: 12px 16px 12px 42px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-primary); font-size: 0.95rem; outline: none; transition: border-color .2s; box-sizing: border-box; }
        .tools-search input:focus { border-color: var(--accent-cyan); }
        .tools-search .s-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 1.1rem; pointer-events: none; }
        .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-chip { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-secondary); font-size: 0.85rem; cursor: pointer; transition: all .2s; white-space: nowrap; user-select: none; }
        .filter-chip:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .filter-chip.active { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); font-weight: 600; }

        /* ===== Featured Section ===== */
        .section-wrapper { max-width: 1300px; margin: 0 auto 60px; padding: 0 20px; }
        .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
        .section-icon { font-size: 1.5rem; }
        .section-title { font-size: 1.5rem; font-weight: 700; color: #fff; margin: 0; }
        .section-count { font-size: 0.82rem; color: rgba(255,255,255,0.5); background: var(--bg-card); padding: 3px 10px; border-radius: 12px; }
        .featured-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }

        .featured-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 28px 22px; cursor: pointer; transition: all .25s; position: relative; overflow: hidden; text-decoration: none; display: block; }
        .featured-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); opacity: 0; transition: opacity .25s; }
        .featured-card:hover { transform: translateY(-4px); border-color: rgba(0,229,255,0.3); box-shadow: 0 8px 30px rgba(0,229,255,0.08); }
        .featured-card:hover::before { opacity: 1; }
        .featured-card .fc-icon { font-size: 2.4rem; margin-bottom: 14px; display: block; }
        .featured-card .fc-name { font-size: 1.15rem; font-weight: 700; color: #fff; margin: 0 0 6px; }
        .featured-card .fc-desc { font-size: 0.82rem; color: rgba(255,255,255,0.7); line-height: 1.5; margin: 0 0 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .featured-card .fc-meta { display: flex; align-items: center; gap: 8px; }
        .featured-card .fc-tag { font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); }
        .featured-card .fc-platforms { display: flex; gap: 4px; margin-left: auto; }
        .featured-card .fc-platforms span { font-size: 0.65rem; padding: 2px 7px; border-radius: 4px; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); }

        /* ===== Category Section ===== */
        .cat-section { margin-bottom: 56px; }
        .cat-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border-color); }
        .cat-header .cat-icon { font-size: 1.6rem; }
        .cat-header .cat-title { font-size: 1.35rem; font-weight: 700; color: #fff; margin: 0; }
        .cat-header .cat-desc { font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-left: 8px; }
        .cat-header .cat-count { margin-left: auto; font-size: 0.82rem; color: rgba(255,255,255,0.5); background: var(--bg-card); padding: 3px 10px; border-radius: 12px; }
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

        .tool-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px 18px; cursor: pointer; transition: all .2s; position: relative; text-decoration: none; display: flex; gap: 14px; align-items: flex-start; }
        .tool-card::after { content: ''; position: absolute; left: 0; top: 10%; bottom: 10%; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent-cyan); transform: scaleY(0); transition: transform .2s; }
        .tool-card:hover { border-color: rgba(0,229,255,0.25); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .tool-card:hover::after { transform: scaleY(1); }
        .tool-card .tc-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; background: rgba(255,255,255,0.04); flex-shrink: 0; }
        .tool-card .tc-body { flex: 1; min-width: 0; }
        .tool-card .tc-name { font-size: 0.95rem; font-weight: 600; color: #fff; margin: 0 0 4px; }
        .tool-card .tc-desc { font-size: 0.78rem; color: rgba(255,255,255,0.7); line-height: 1.45; margin: 0 0 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .tool-card .tc-bottom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .tool-card .tc-tag { font-size: 0.68rem; padding: 2px 7px; border-radius: 5px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); white-space: nowrap; }
        .tool-card .tc-platforms { display: flex; gap: 3px; margin-left: auto; }
        .tool-card .tc-platforms span { font-size: 0.62rem; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.5); }

        /* No Results */
        .no-results { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.4); }
        .no-results .nr-icon { font-size: 3rem; margin-bottom: 12px; }
        .no-results p { font-size: 0.95rem; }

        /* Responsive */
        @media (max-width: 1100px) { .featured-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 700px) {
            .featured-grid { grid-template-columns: 1fr; }
            .tools-hero h1 { font-size: 2rem; }
            .tools-grid { grid-template-columns: 1fr; }
            .tools-stats { gap: 24px; }
            .tools-bar { flex-direction: column; align-items: stretch; }
            .filter-chips { justify-content: center; }
        }
    </style>
</head>

    <script>
    (function() {
        var searchInput = document.getElementById('searchInput');
        var filterChips = document.getElementById('filterChips');
        var featuredGrid = document.getElementById('featuredGrid');
        var featuredSection = document.getElementById('featuredSection');
        var featuredCount = document.getElementById('featuredCount');
        var categorySections = document.getElementById('categorySections');
        var navDate = document.getElementById('navDate');
        var footerDate = document.getElementById('footerDate');

        var search = '';
        var activeCat = 'all';

        function getFeaturedTools() {
            return TOOLS.filter(function(t) { return FEATURED_IDS.indexOf(t.id) !== -1; });
        }

        function getCatTools(catKey) {
            return TOOLS.filter(function(t) { return t.category === catKey; });
        }

        function matchesSearch(tool) {
            if (!search) return true;
            var s = search.toLowerCase();
            return tool.name.toLowerCase().indexOf(s) !== -1 ||
                   tool.desc.toLowerCase().indexOf(s) !== -1 ||
                   tool.tags.some(function(t) { return t.toLowerCase().indexOf(s) !== -1; });
        }

        function matchesCat(tool) {
            return activeCat === 'all' || tool.category === activeCat;
        }

        function platLabel(p) {
            var map = { mac:'Mac', win:'Win', windows:'Win', linux:'Linux', ios:'iOS', android:'Android', web:'Web' };
            return map[p] || p;
        }

        function platformsHtml(p) {
            var list = p || [];
            return list.map(function(x) { return '<span>'+platLabel(x)+'</span>'; }).join('');
        }

        function renderFeatured() {
            var tools = getFeaturedTools();
            var filtered = tools.filter(function(t) { return matchesSearch(t) && matchesCat(t); });
            featuredCount.textContent = filtered.length;
            featuredSection.style.display = (filtered.length === 0 && search) ? 'none' : '';
            featuredGrid.innerHTML = filtered.map(function(t) {
                return '<a href="'+t.url+'" target="_blank" rel="noopener" class="featured-card">'+
                    '<span class="fc-icon">'+t.icon+'</span>'+
                    '<div class="fc-name">'+t.name+'</div>'+
                    '<p class="fc-desc">'+t.desc+'</p>'+
                    '<div class="fc-meta">'+
                        '<span class="fc-tag">'+(t.tags[0]||'')+'</span>'+
                        '<div class="fc-platforms">'+platformsHtml(t.platform)+'</div>'+
                    '</div></a>';
            }).join('');
        }

        function renderCategories() {
            var html = '';
            TOOL_CATEGORIES.forEach(function(cat) {
                var tools = getCatTools(cat.key);
                var filtered = tools.filter(function(t) { return matchesSearch(t); });
                var visible = (activeCat === 'all' || activeCat === cat.key);
                if (!visible && filtered.length === 0) return;
                html += '<div class="cat-section"' + (visible ? '' : ' style="display:none"') + '>'+
                    '<div class="cat-header">'+
                        '<span class="cat-icon">'+cat.icon+'</span>'+
                        '<span class="cat-title">'+cat.name+'</span>'+
                        '<span class="cat-desc">'+cat.desc+'</span>'+
                        '<span class="cat-count">'+filtered.length+' 款</span>'+
                    '</div>'+
                    '<div class="tools-grid">'+filtered.map(function(t) {
                        return '<a href="'+t.url+'" target="_blank" rel="noopener" class="tool-card">'+
                            '<div class="tc-icon">'+t.icon+'</div>'+
                            '<div class="tc-body">'+
                                '<div class="tc-name">'+t.name+'</div>'+
                                '<p class="tc-desc">'+t.desc+'</p>'+
                                '<div class="tc-bottom">'+
                                    t.tags.slice(0,2).map(function(tag){return '<span class="tc-tag">'+tag+'</span>';}).join('')+
                                    '<div class="tc-platforms">'+platformsHtml(t.platform)+'</div>'+
                                '</div>'+
                            '</div></a>';
                    }).join('')+'</div></div>';
            });
            categorySections.innerHTML = html;
        }

        function renderFilters() {
            var chips = '<span class="filter-chip'+(activeCat==='all'?' active':'')+'" data-cat="all">全部</span>';
            TOOL_CATEGORIES.forEach(function(cat) {
                chips += '<span class="filter-chip'+(activeCat===cat.key?' active':'')+'" data-cat="'+cat.key+'">'+cat.icon+' '+cat.name+'</span>';
            });
            filterChips.innerHTML = chips;
            filterChips.querySelectorAll('.filter-chip').forEach(function(chip) {
                chip.addEventListener('click', function() {
                    activeCat = this.getAttribute('data-cat');
                    renderAll();
